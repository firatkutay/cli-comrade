name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # Also runs internal/cli's TestReleaseArchiveNamingIsConsistent...
      # (FAZ 10's release-name drift guard): a Go test, not a separate
      # step, so a hand-maintained mirror between .goreleaser.yaml's
      # archives[].name_template, scripts/install.sh, scripts/
      # install.ps1, and internal/update's ArchiveName/BinaryName/
      # ChecksumsFileName drifting in EITHER direction fails this exact
      # step on every PR — see internal/cli/release_names_test.go.
      - name: Test
        run: go test ./...

      # Coverage ratchet (GitHub issue #21): fails when a package's
      # coverage drops below its recorded floor in coverage-floors.txt,
      # or when that file drifts out of sync with go list ./... in
      # either direction — see coverage-floors.txt's own header.
      #
      # Linux-leg only (`if:` below), on purpose: the floors in
      # coverage-floors.txt were measured on ubuntu-latest, and
      # per-package coverage genuinely differs by OS in this repo —
      # internal/executor and internal/shellinit branch on runtime.GOOS
      # (only one branch executes per OS), internal/doctor/check_path.go
      # is GOOS-aware, and several tests skip on Windows (e.g.
      # chmod-based cases). Running this same check on macos-26/
      # windows-latest against Linux-measured floors would fail on
      # those legs for a real OS-coverage difference, not a real
      # regression — a red PR that says nothing about a bug. `shell:
      # bash` is kept (rather than dropped along with the other two
      # legs) so this step still runs correctly if the `if:` is ever
      # loosened back to all three.
      - name: Coverage floors
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/check-coverage-floors.sh

      # npm distribution (stage 1) tests: the dispatcher/platform-map
      # assertion scripts, the assembly script's failure-mode tests (bad
      # version, missing binary, version/metadata mismatch, dangerous
      # out-dir), and the git-index exec-bit recurrence guard (see
      # npm/test/test-script-permissions.sh — this exact class of bug,
      # a script committed non-executable and invoked directly, has
      # shipped broken twice; this step is what would have caught it on
      # the very first push). Linux-leg only: npm/test/test-smoke.sh (run
      # below) is explicitly Linux-only per its own header, and jq/bash
      # are not guaranteed on the other legs the same way.
      - name: Set up Node.js
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: npm distribution tests
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: make npm-test

      # npm end-to-end install smoke test: this is deliberately a real
      # integration check (real goreleaser dist/, a real `npm install -g
      # cli-comrade`, a real dispatcher launch) gated on every PR rather
      # than demoted to nightly — a prior review round found a
      # dispatcher-bypass bug that ONLY this kind of end-to-end check
      # catches (npm/test/test-smoke.sh's own header has the full story).
      # It costs a real, if bounded, amount of CI time: cross-compiling
      # all 5 npm-distribution targets from scratch. Uses `goreleaser
      # build` (not `release`) deliberately: the smoke test only ever
      # reads the per-target binary dirs and metadata.json, both of which
      # `build` emits identically to `release` -- `release` additionally
      # produces archives, .deb/.rpm packages, checksums, and three
      # package-manager manifests that nothing on this path reads, and
      # measured ~40% slower for it (no signing either, since `build`
      # never invokes the `signs:` pipe -- there is nothing to `--skip`).
      # Reads the version to stamp from dist/metadata.json's own "tag"
      # (rather than a git-tag lookup) so this works correctly regardless
      # of this job's checkout depth/tag visibility.
      - name: Install goreleaser (for the npm smoke test's dist/ input)
        if: matrix.os == 'ubuntu-latest'
        run: make tools

      - name: Build a snapshot dist/ for the npm smoke test
        if: matrix.os == 'ubuntu-latest'
        run: goreleaser build --snapshot --clean

      - name: npm end-to-end install smoke test
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          smoke_version="$(jq -r '.tag' dist/metadata.json | sed 's/^v//')"
          make npm-smoke NPM_VERSION="${smoke_version}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  # FAZ 11 hardening: fails the PR if any dependency (stdlib included —
  # setup-go's go-version-file resolves the exact toolchain this repo's
  # go.mod pins, so a stdlib CVE fixed in a newer patch release is
  # caught too, not just third-party module CVEs) has a known,
  # call-reachable vulnerability. Pinned to v1.4.0 (see go.mod's own
  # comment trail / docs/history/phases/FAZ-11.md for the 15-day version-
  # selection rationale) via `go install`, not a third-party Action, so
  # this step's supply-chain surface is exactly "the Go toolchain +
  # golang.org/x/vuln" — nothing else to audit or pin by SHA.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0

      - name: govulncheck
        run: govulncheck ./...

  # GitHub issue #29: static analysis for the shell scripts that actually
  # run on users' machines, most critically scripts/install.sh -- the
  # exact script piped through `curl | sh` by the README's one-liner, and
  # (as of PR #45) the one that now performs cosign ECDSA signature
  # verification via openssl. There was previously zero shell linting of
  # any kind between a commit and that code executing on a real machine.
  #
  # Preinstalled binary, not a third-party Action: ShellCheck ships
  # already installed on the GitHub-hosted ubuntu-latest runner image
  # (confirmed via actions/runner-images's Ubuntu2404-Readme.md software
  # list, which is what ubuntu-latest currently resolves to) — using it
  # directly keeps this job's supply-chain surface at zero beyond the
  # runner image itself: no new `uses:` step to pin/audit, no download to
  # checksum-verify.
  #
  # Dialect picked per file from its own shebang, not one blanket
  # setting: scripts/install.sh and scripts/install_test.sh are
  # `#!/bin/sh`/`#!/usr/bin/env sh` (install.sh is invoked via
  # `curl | sh`, so it must stay POSIX-sh-clean) and are linted with
  # `-s sh`; everything else under scripts/ and npm/test/ is
  # `#!/usr/bin/env bash` and linted with `-s bash`. `-x` lets
  # install_test.sh's `# shellcheck source=SCRIPTDIR/install.sh` directive
  # actually follow install.sh regardless of the job's invocation cwd.
  #
  # Run at DEFAULT severity (no `-S error` downgrade) so new warnings,
  # not just errors, block merge — the info-level SC2016 hits this
  # already found (deliberately literal, unexpanded "$HOME"/"$PATH" text
  # written into a user's rc file) are suppressed narrowly, per-line, in
  # the scripts themselves, with a comment explaining why; nothing is
  # downgraded at the job level.
  #
  # File set enumerated dynamically (find, not a hardcoded list) so a
  # future script under scripts/ or npm/test/ is covered automatically
  # instead of silently going unlinted.
  #
  # Secret scanning (gitleaks) and SBOM/SCA (Syft/Grype) decision, per
  # this issue's acceptance criteria: DECLINED in this PR, tracked as
  # separate work in issue #47. This repo has no dependency manifest that
  # changes often enough yet to justify a recurring SCA job (a single
  # go.sum, already covered for known CVEs by the vulncheck job above),
  # and no secret-scanning gate exists at all today, so there's nothing
  # for gitleaks to regress against without a dedicated rollout (baseline
  # scan, allowlist for any existing false positives). Both landed as the
  # `gitleaks` and `sbom-scan` jobs below — see each job's own comment
  # block for the scope decisions made when they were actually wired in.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        shell: bash
        run: |
          set -euo pipefail
          shellcheck --version

          status=0
          while IFS= read -r -d '' file; do
            case "$(head -n1 "$file")" in
              '#!/bin/sh' | '#!/usr/bin/env sh')
                dialect=sh
                ;;
              *)
                dialect=bash
                ;;
            esac
            echo "::group::shellcheck -x -s ${dialect} ${file}"
            if ! shellcheck -x -s "${dialect}" "${file}"; then
              status=1
            fi
            echo "::endgroup::"
          done < <(find scripts npm/test -name '*.sh' -print0 | sort -z)

          exit "${status}"

  # GitHub issue #47: secret scanning. Follow-up from #29, whose own
  # decision (comment block above) explicitly deferred this to a
  # dedicated issue rather than bundling it into a shell-linting change.
  #
  # Scope decision — working tree vs. full history, per issue #47's
  # acceptance criteria: this job scans the WORKING TREE (`gitleaks dir`)
  # on every push/PR, not full git history. A one-off FULL HISTORY scan
  # (`gitleaks git --redact --log-opts="--all"`, all 226 commits / every
  # ref, at the time this job was added) was run locally first, per the
  # issue's mandatory baseline requirement — see the implementing PR's
  # description for the result (zero real credentials found). Full-
  # history rescanning on every PR is a cost that grows with total repo
  # history forever, for value this repo doesn't need day to day: commits
  # land via direct push/self-merge (trunk-based, see git-workflow), so
  # the "secret added then removed before merge" threat a history scan
  # specifically defends against doesn't really apply here — and neither
  # of this repo's two known real-secret-adjacent items (the cosign
  # signing key, held only as a GitHub Actions secret, never committed;
  # an npm token leaked via chat and revoked, also never committed) would
  # have been caught by scanning git contents at any depth. Re-run the
  # full-history scan manually before onboarding an external contributor,
  # or periodically as a standing audit — it is not wired into this job.
  #
  # Installed via `go install`, pinned to v8.30.1 (released 2026-03-21,
  # comfortably past the 15-day floor) — same convention as the
  # vulncheck job above: no third-party Action to pin/audit, no download
  # to checksum-verify by hand (`go install` verifies module content
  # against the public checksum database), supply-chain surface is
  # exactly the Go toolchain + this one module. (gitleaks-action v3 was
  # considered and rejected: its repo's license metadata resolves to
  # "Other"/NOASSERTION on GitHub rather than a clear OSI license —
  # avoided rather than chased down, since `go install` sidesteps the
  # question entirely.) Note gitleaks' upstream GitHub organization is
  # "gitleaks" but its go.mod still declares the module path under the
  # tool's original author, zricethezav — intentional upstream quirk
  # confirmed against the v8.30.1 tag's own go.mod, not a typo here.
  #
  # .gitleaks.toml extends (not replaces) the built-in default ruleset
  # and allowlists, per rule ID + exact file path, the golden-test
  # fixtures in internal/redact/redact_test.go and
  # internal/llm/client_redact_test.go — deliberately fake, secret-shaped
  # strings used to assert internal/redact's masking pipeline actually
  # masks them. See .gitleaks.toml's own header comment for why the
  # cosign PUBLIC key embedded in scripts/install.sh and
  # internal/update/cosign.pub needed no allowlist entry: verified
  # empirically that it does not match gitleaks' "private-key" rule
  # (that rule targets PRIVATE key PEM blocks specifically).
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: gitleaks (working tree)
        run: gitleaks dir --redact --exit-code 1 --config .gitleaks.toml .

  # GitHub issue #47: SBOM (Syft) + SCA (Grype).
  #
  # Reconciled against release.yml's existing SBOM step before adding
  # this (release.yml itself is out of scope for this PR — PR #41 is in
  # flight there; this is reported, not fixed, here): that step (also
  # anchore/sbom-action) generates a source SBOM at release time, but
  # writes it to `${{ runner.temp }}` with upload-release-assets AND
  # upload-artifact both false — so today it is generated and then
  # discarded, never actually attached to a release or uploaded anywhere.
  # That means this repo currently has NO durable SBOM artifact from any
  # pipeline, release or CI. Generating one here, on every push/PR, is
  # therefore not a duplicate of working release-time coverage — it is
  # this repo's only actual retrievable SBOM artifact right now, and
  # per-PR generation additionally proves the SBOM stays generatable on
  # every change, not just at tag time.
  #
  # Grype vs. govulncheck, decided empirically rather than assumed:
  # before writing this job, syft was run against this repo's own source
  # and grype against the resulting SBOM. It found exactly one issue —
  # GO-2026-5970 (High) in golang.org/x/text v0.28.0, fixed in v0.39.0 —
  # which govulncheck (the `vulncheck` job above) already knows about and
  # already correctly excludes, because its call-graph analysis proves
  # this repo's code never reaches the vulnerable (infinite-loop-on-
  # invalid-input) symbols — confirmed side by side, same GO-2026-5970 ID
  # in both tools' output. Grype has no reachability analysis: at the
  # issue's own suggested `--fail-on high` threshold it would fail this
  # exact job on a vulnerability govulncheck has already triaged as a
  # non-issue for this codebase — precisely the "gate people learn to
  # ignore" failure mode this issue asked to avoid. Given this repo has
  # exactly one dependency manifest (go.mod/go.sum) and govulncheck's
  # reachability check strictly dominates Grype's version-only matching
  # for every finding a Go-only repo like this one can produce, Grype
  # runs here as an INFORMATIONAL, non-blocking step (`fail-build:
  # false`) — its value is defense-in-depth against a DB-freshness gap
  # (Grype's feeds can occasionally carry a real NVD/GHSA advisory before
  # Go's own vulndb curates it), surfaced as build-log table output for a
  # human to read, not a merge-blocking gate that would routinely fire on
  # already-triaged noise.
  sbom-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-release-assets: false
          upload-artifact: true
          artifact-name: sbom.cdx.json

      - name: Scan SBOM with Grype (informational — see comment above)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: sbom.cdx.json
          fail-build: false
          output-format: table
