name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # Also runs internal/cli's TestReleaseArchiveNamingIsConsistent...
      # (FAZ 10's release-name drift guard): a Go test, not a separate
      # step, so a hand-maintained mirror between .goreleaser.yaml's
      # archives[].name_template, scripts/install.sh, scripts/
      # install.ps1, and internal/update's ArchiveName/BinaryName/
      # ChecksumsFileName drifting in EITHER direction fails this exact
      # step on every PR — see internal/cli/release_names_test.go.
      - name: Test
        run: go test ./...

      # Coverage ratchet (GitHub issue #21): fails when a package's
      # coverage drops below its recorded floor in coverage-floors.txt,
      # or when that file drifts out of sync with go list ./... in
      # either direction — see coverage-floors.txt's own header.
      #
      # Linux-leg only (`if:` below), on purpose: the floors in
      # coverage-floors.txt were measured on ubuntu-latest, and
      # per-package coverage genuinely differs by OS in this repo —
      # internal/executor and internal/shellinit branch on runtime.GOOS
      # (only one branch executes per OS), internal/doctor/check_path.go
      # is GOOS-aware, and several tests skip on Windows (e.g.
      # chmod-based cases). Running this same check on macos-26/
      # windows-latest against Linux-measured floors would fail on
      # those legs for a real OS-coverage difference, not a real
      # regression — a red PR that says nothing about a bug. `shell:
      # bash` is kept (rather than dropped along with the other two
      # legs) so this step still runs correctly if the `if:` is ever
      # loosened back to all three.
      - name: Coverage floors
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/check-coverage-floors.sh

      # npm distribution (stage 1) tests: the dispatcher/platform-map
      # assertion scripts, the assembly script's failure-mode tests (bad
      # version, missing binary, version/metadata mismatch, dangerous
      # out-dir), and the git-index exec-bit recurrence guard (see
      # npm/test/test-script-permissions.sh — this exact class of bug,
      # a script committed non-executable and invoked directly, has
      # shipped broken twice; this step is what would have caught it on
      # the very first push). Linux-leg only: npm/test/test-smoke.sh (run
      # below) is explicitly Linux-only per its own header, and jq/bash
      # are not guaranteed on the other legs the same way.
      - name: Set up Node.js
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: npm distribution tests
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: make npm-test

      # npm end-to-end install smoke test: this is deliberately a real
      # integration check (real goreleaser dist/, a real `npm install -g
      # cli-comrade`, a real dispatcher launch) gated on every PR rather
      # than demoted to nightly — a prior review round found a
      # dispatcher-bypass bug that ONLY this kind of end-to-end check
      # catches (npm/test/test-smoke.sh's own header has the full story).
      # It costs a real, if bounded, amount of CI time: cross-compiling
      # all 5 npm-distribution targets from scratch. Uses `goreleaser
      # build` (not `release`) deliberately: the smoke test only ever
      # reads the per-target binary dirs and metadata.json, both of which
      # `build` emits identically to `release` -- `release` additionally
      # produces archives, .deb/.rpm packages, checksums, and three
      # package-manager manifests that nothing on this path reads, and
      # measured ~40% slower for it (no signing either, since `build`
      # never invokes the `signs:` pipe -- there is nothing to `--skip`).
      # Reads the version to stamp from dist/metadata.json's own "tag"
      # (rather than a git-tag lookup) so this works correctly regardless
      # of this job's checkout depth/tag visibility.
      - name: Install goreleaser (for the npm smoke test's dist/ input)
        if: matrix.os == 'ubuntu-latest'
        run: make tools

      - name: Build a snapshot dist/ for the npm smoke test
        if: matrix.os == 'ubuntu-latest'
        run: goreleaser build --snapshot --clean

      - name: npm end-to-end install smoke test
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          smoke_version="$(jq -r '.tag' dist/metadata.json | sed 's/^v//')"
          make npm-smoke NPM_VERSION="${smoke_version}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  # FAZ 11 hardening: fails the PR if any dependency (stdlib included —
  # setup-go's go-version-file resolves the exact toolchain this repo's
  # go.mod pins, so a stdlib CVE fixed in a newer patch release is
  # caught too, not just third-party module CVEs) has a known,
  # call-reachable vulnerability. Pinned to v1.4.0 (see go.mod's own
  # comment trail / docs/history/phases/FAZ-11.md for the 15-day version-
  # selection rationale) via `go install`, not a third-party Action, so
  # this step's supply-chain surface is exactly "the Go toolchain +
  # golang.org/x/vuln" — nothing else to audit or pin by SHA.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.4.0

      - name: govulncheck
        run: govulncheck ./...

  # GitHub issue #29: static analysis for the shell scripts that actually
  # run on users' machines, most critically scripts/install.sh -- the
  # exact script piped through `curl | sh` by the README's one-liner, and
  # (as of PR #45) the one that now performs cosign ECDSA signature
  # verification via openssl. There was previously zero shell linting of
  # any kind between a commit and that code executing on a real machine.
  #
  # Preinstalled binary, not a third-party Action: ShellCheck ships
  # already installed on the GitHub-hosted ubuntu-latest runner image
  # (confirmed via actions/runner-images's Ubuntu2404-Readme.md software
  # list, which is what ubuntu-latest currently resolves to) — using it
  # directly keeps this job's supply-chain surface at zero beyond the
  # runner image itself: no new `uses:` step to pin/audit, no download to
  # checksum-verify.
  #
  # Dialect picked per file from its own shebang, not one blanket
  # setting: scripts/install.sh and scripts/install_test.sh are
  # `#!/bin/sh`/`#!/usr/bin/env sh` (install.sh is invoked via
  # `curl | sh`, so it must stay POSIX-sh-clean) and are linted with
  # `-s sh`; everything else under scripts/ and npm/test/ is
  # `#!/usr/bin/env bash` and linted with `-s bash`. `-x` lets
  # install_test.sh's `# shellcheck source=SCRIPTDIR/install.sh` directive
  # actually follow install.sh regardless of the job's invocation cwd.
  #
  # Run at DEFAULT severity (no `-S error` downgrade) so new warnings,
  # not just errors, block merge — the info-level SC2016 hits this
  # already found (deliberately literal, unexpanded "$HOME"/"$PATH" text
  # written into a user's rc file) are suppressed narrowly, per-line, in
  # the scripts themselves, with a comment explaining why; nothing is
  # downgraded at the job level.
  #
  # File set enumerated dynamically (find, not a hardcoded list) so a
  # future script under scripts/ or npm/test/ is covered automatically
  # instead of silently going unlinted.
  #
  # Secret scanning (gitleaks) and SBOM/SCA (Syft/Grype) decision, per
  # this issue's acceptance criteria: explicitly DECLINED in this PR.
  # This repo has no dependency manifest that changes often enough yet to
  # justify a recurring SCA job (a single go.sum, already covered for
  # known CVEs by the vulncheck job above), and no secret-scanning gate
  # exists at all today, so there's nothing for gitleaks to regress
  # against without a dedicated rollout (baseline scan, allowlist for any
  # existing false positives). Both are real, valuable, separate work —
  # tracked in issue #47 — not bundled into this shell-linting change.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        shell: bash
        run: |
          set -euo pipefail
          shellcheck --version

          status=0
          while IFS= read -r -d '' file; do
            case "$(head -n1 "$file")" in
              '#!/bin/sh' | '#!/usr/bin/env sh')
                dialect=sh
                ;;
              *)
                dialect=bash
                ;;
            esac
            echo "::group::shellcheck -x -s ${dialect} ${file}"
            if ! shellcheck -x -s "${dialect}" "${file}"; then
              status=1
            fi
            echo "::endgroup::"
          done < <(find scripts npm/test -name '*.sh' -print0 | sort -z)

          exit "${status}"
